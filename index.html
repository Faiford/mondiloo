header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}

.langs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.langs button{font:800 13px var(--body);border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 10px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding:24px 0 40px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,6.4vw,64px);line-height:1.02;margin:0 0 14px;letter-spacing:-.01em;text-wrap:balance}

.lead{font-size:clamp(17px,2.2vw,20px);color:var(--muted);margin:0 0 22px;max-width:34em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 18px var(--body);text-decoration:none;border-radius:18px;padding:14px 22px;border:0;cursor:pointer;box-shadow:0 5px 0 rgba(36,48,94,.18)}
.btn.main{background:var(--leaf);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:active{transform:translateY(2px)}
.trust{display:flex;flex-wrap:wrap;gap:8px 16px;margin:22px 0 0;padding:0;list-style:none;font-weight:800;font-size:15px}
.trust li{display:flex;align-items:center;gap:6px}
.phones{position:relative;height:520px}
.phone{position:absolute;width:250px;border-radius:30px;border:8px solid var(--ink);background:var(--ink);box-shadow:0 18px 40px rgba(36,48,94,.22);overflow:hidden}
.phone img{display:block;width:100%;height:auto;border-radius:22px}
.phone.a{right:110px;top:0;transform:rotate(-4deg)}
.phone.b{right:0;top:60px;transform:rotate(5deg)}
.tiki{position:absolute;left:0;bottom:10px;width:120px;border-radius:28px;filter:drop-shadow(0 8px 10px rgba(36,48,94,.18));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
section{padding:44px 0}
h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.4vw,44px);line-height:1.05;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 26px;max-width:40em}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px}
.card .e{font-size:38px;line-height:1}
.card h3{font-family:var(--display);font-weight:800;font-size:22px;margin:8px 0 4px;line-height:1.15}
.card p{margin:0;color:var(--muted);font-size:16px}
.ages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.age{border-radius:24px;padding:22px;color:#fff}
.age b{font-family:var(--display);font-size:32px;display:block;line-height:1}
.age span{display:block;font-weight:700;margin-top:6px;opacity:.95}
.age:nth-child(1){background:var(--coral)}.age:nth-child(2){background:var(--sky)}.age:nth-child(3){background:var(--grape)}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px;-webkit-overflow-scrolling:touch}
.strip figure{margin:0;flex:0 0 220px;scroll-snap-align:start}
.strip img{width:100%;height:auto;border-radius:22px;border:6px solid var(--ink);display:block}
.strip figcaption{font-weight:800;text-align:center;margin-top:8px;font-size:15px}
.inst{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.instc{background:#fff;border:2px solid var(--line);border-radius:24px;padding:22px}
.instc h3{margin:0 0 10px}
.instc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.instc li{display:flex;align-items:center;gap:12px;font-weight:700;counter-increment:st}
.instc li::before{content:counter(st);flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px}
.instc .ico{flex:0 0 36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.instc .note{margin-top:12px}
@media (max-width:720px){.inst{grid-template-columns:1fr}}
.prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.price{background:#fff;border:2px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:10px}
.price.best{border:3px solid var(--grape);position:relative}
.price .tag{position:absolute;top:-14px;left:24px;background:var(--grape);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:4px 12px}
.price h3{font-family:var(--display);font-size:22px;margin:0}
.price .amt{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.price .amt small{font-size:16px;color:var(--muted);font-family:var(--body)}
.price ul{margin:0;padding-left:20px;color:var(--muted);font-size:16px;flex:1}
.price .btn{width:100%}
.note{color:var(--muted);font-size:15px;text-align:center;margin-top:16px}
details{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:10px}
summary{font-weight:800;cursor:pointer}
details p{margin:8px 0 0;color:var(--muted)}
.final{background:var(--ink);color:#fff;border-radius:32px;padding:40px 24px;text-align:center;margin:20px 0 40px}
.final h2{color:#fff}
.final p{color:#C9D0EE;margin:0 0 20px}
footer{padding:24px 0 40px;color:var(--muted);font-size:14px;text-align:center}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:8px}
  .phones{height:430px;max-width:420px;margin:0 auto;width:100%}

  .tiki{width:96px}
  .grid,.prices{grid-template-columns:1fr 1fr}

@media (max-width:560px){

  .phones{height:380px}.phone{width:170px}.phone.a{left:14%}
  .btn{width:100%}
  header{flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){.tiki{animation:none}html{scroll-behavior:auto}}

function setLang(l){
  if(!T[l])l="en";const d=T[l];
  document.documentElement.lang=l==="ht"?"ht":l;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=d[el.dataset.t];if(v!=null)el.innerHTML=v;});
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  try{localStorage.setItem("ml-site-lang",l);}catch(e){}
}
document.querySelectorAll("[data-l]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
let start="en";try{start=localStorage.getItem("ml-site-lang")||"";}catch(e){}
if(!start){const n=(navigator.language||"en").slice(0,2).toLowerCase();start={ht:"ht",fr:"fr",es:"es"}[n]||"en";}
setLang(start);
</script>
